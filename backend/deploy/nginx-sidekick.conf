# nginx vhost for the Sidekick backend, on a host that already serves other sites.
# Copy to /etc/nginx/sites-available/sidekick.example.com, symlink into sites-enabled, reload.

# Sign-in attempts, per IP: a password guesser gets 5 a minute, a person never notices.
limit_req_zone $binary_remote_addr zone=sidekick_login:10m rate=5r/m;
# "Too many requests" rather than nginx's default "service unavailable", which reads as an outage.
limit_req_status 429;

server {
    listen 80;
    server_name sidekick.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sidekick.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # App installers are uploaded through this vhost.
    client_max_body_size 256m;

    # Keep idle connections from Cloudflare open between hints (nginx's default is 75 s), so a hint
    # after a quiet stretch doesn't pay for a new connection to this server. Longer than
    # Cloudflare's own 900 s idle limit, so nginx never closes a connection Cloudflare is about to
    # reuse (a POST sent down it would fail with a 520 that Cloudflare doesn't retry).
    keepalive_timeout 960s;

    location /auth/login {
        limit_req zone=sidekick_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8020;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        include /etc/nginx/proxy_params;

        # Publishing a build and downloading one both take a while on a slow line.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}
